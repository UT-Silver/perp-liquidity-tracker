<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perp DEX 开仓成本追踪</title>
<style>
.viz-root {
  color-scheme: light;
  --surface-0: #f4f4f2; --surface-1: #fcfcfb; --surface-2: #f0efec;
  --border: #e3e2de; --grid: #ecebe7;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7c7b76;
  --accent: #2a78d6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  .viz-root {
    color-scheme: dark;
    --surface-0: #121211; --surface-1: #1a1a19; --surface-2: #232321;
    --border: #2e2e2c; --grid: #262624;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --accent: #3987e5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
body { margin: 0; }
.viz-root { background: var(--surface-0); color: var(--text-primary); min-height: 100vh;
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1440px; margin: 0 auto; padding: 28px 28px 48px; }

header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
h1 { font-size: 22px; font-weight: 650; letter-spacing: -.01em; margin: 0 0 4px; }
.sub { color: var(--text-secondary); margin: 0; max-width: 720px; }
.sub a { color: var(--accent); text-decoration: none; }
.status { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px;
  background: var(--surface-1); border: 1px solid var(--border); font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--s3); }
.pill b { color: var(--text-primary); font-weight: 600; font-variant-numeric: tabular-nums; }

.bar { z-index: 5; background: color-mix(in srgb, var(--surface-0) 88%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); margin: 0 -28px 18px; padding: 12px 28px; border-bottom: 1px solid var(--border); }
.controls { display: flex; flex-wrap: wrap; gap: 12px 22px; align-items: flex-end; }
.ctl > label { display: block; font-size: 11px; letter-spacing: .04em; color: var(--text-muted); margin-bottom: 5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface-1);
  color: var(--text-secondary); padding: 5px 11px; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer; line-height: 1.2; }
.chip:hover { border-color: var(--text-muted); }
.chip[aria-pressed="true"] { background: var(--text-primary); border-color: var(--text-primary); color: var(--surface-1); }
.chip.venue[aria-pressed="true"] { background: var(--surface-1); color: var(--text-primary); border-color: var(--text-secondary); }
.chip.venue[aria-pressed="false"] { opacity: .55; }
.chip.venue[aria-pressed="false"] .sw { background: var(--text-muted) !important; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface-1); }
.seg button { border: 0; background: transparent; color: var(--text-secondary); padding: 5px 11px; font: inherit; font-size: 13px; cursor: pointer; line-height: 1.2; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--text-primary); font-weight: 600; }
.sw { width: 12px; height: 3px; border-radius: 2px; display: inline-block; flex: none; }

.hint { font-size: 12px; color: var(--text-muted); margin: 0 0 14px; }
.token-row { margin-bottom: 22px; }
.token-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px; }
.token-head h2 { font-size: 16px; font-weight: 650; margin: 0; }
.token-head span { font-size: 12px; color: var(--text-muted); }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); }
@media (min-width: 900px) { .bar { position: sticky; top: 0; } }
@media (max-width: 1100px) { .grid { grid-template-columns: repeat(min(var(--cols), 2), minmax(0, 1fr)); } }
@media (max-width: 680px)  { .grid { grid-template-columns: 1fr; } .wrap { padding: 20px 16px 40px; } .bar { margin: 0 -16px 16px; padding: 10px 16px; } }

.panel { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 14px 14px 8px; box-shadow: var(--shadow); min-width: 0; }
.p-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
.p-title { font-size: 14px; font-weight: 600; }
.p-title small { color: var(--text-muted); font-weight: 400; margin-left: 4px; }
.best { text-align: right; font-size: 11px; color: var(--text-muted); line-height: 1.3; }
.best b { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--text-primary); font-weight: 600; font-variant-numeric: tabular-nums; }
.chart { position: relative; }
svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.axis text { fill: var(--text-muted); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.gridline { stroke: var(--grid); stroke-width: 1; }
.tip { position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 10px; font-size: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.14); min-width: 160px; display: none; z-index: 3; }
.tip .t { color: var(--text-muted); margin-bottom: 4px; }
.tip .r { display: flex; align-items: center; gap: 12px; justify-content: space-between; padding: 1px 0; }
.tip .r span:first-child { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); }
.tip .v { font-variant-numeric: tabular-nums; color: var(--text-primary); font-weight: 500; }
.empty { color: var(--text-muted); font-size: 12px; padding: 48px 0; text-align: center; }

.tablecard { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-top: 8px; box-shadow: var(--shadow); }
.tablecard summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.tablecard summary span { font-weight: 400; color: var(--text-muted); font-size: 12px; margin-left: 6px; }
.tablewrap { overflow: auto; max-height: 420px; margin-top: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 5px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--text-muted); font-weight: 500; position: sticky; top: 0; background: var(--surface-1); }
td.min { font-weight: 650; }
footer { margin-top: 26px; font-size: 12px; color: var(--text-muted); line-height: 1.7; }
footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="viz-root">
<div class="wrap">
  <header>
    <div>
      <h1>Perp DEX 开仓成本追踪</h1>
      <p class="sub">每小时快照各家订单簿，按市价单逐档吃单计算。<b>总成本</b> = 相对 mid 的滑点 + 基础档 taker 费（bps）。</p>
    </div>
    <div class="status" id="status"></div>
  </header>

  <div class="bar">
    <div class="controls">
      <div class="ctl"><label>币种（可多选）</label><div class="chips" id="tokens"></div></div>
      <div class="ctl" id="clipCtl"><label>单量（可多选）</label><div class="chips" id="clips"></div></div>
      <div class="ctl"><label>指标</label><div class="seg" id="metric"></div></div>
      <div class="ctl"><label>方向</label><div class="seg" id="side"></div></div>
      <div class="ctl"><label>时间</label><div class="seg" id="range"></div></div>
      <div class="ctl"><label>纵轴</label><div class="seg" id="scale"></div></div>
      <div class="ctl"><label>纵轴范围</label><div class="seg" id="share"></div></div>
      <div class="ctl"><label>交易所</label><div class="chips" id="venues"></div></div>
    </div>
  </div>

  <p class="hint" id="hint"></p>
  <div id="panels"><div class="empty">加载数据中…</div></div>

  <details class="tablecard" id="tablecard">
    <summary>最新一次快照<span id="tableSub"></span></summary>
    <div class="tablewrap" id="tablewrap"></div>
  </details>

  <footer>
    空心点 = 那次抓到的盘口不够成交整笔单，数值偏乐观。手续费为基础档（无 VIP / 质押折扣）；Lighter 按 Standard 账户 0 费率计，未反映其下单延迟成本。
    盘口深度各家抓取范围不同，仅适合看同一家随时间的变化。<br>
    数据：<a href="https://github.com/UT-Silver/perp-liquidity-tracker/tree/main/data">github.com/UT-Silver/perp-liquidity-tracker/data</a>
  </footer>
</div>
</div>

<script>
// Venue -> fixed categorical slot (color follows the entity, never its rank or filter state).
const VENUES = ["hyperliquid","lighter","aster","edgex","extended","paradex","grvt"];
const SLOT = {hyperliquid:1, lighter:2, aster:3, edgex:4, extended:5, paradex:6, grvt:7};
const LABEL = {hyperliquid:"Hyperliquid", lighter:"Lighter", aster:"Aster", edgex:"edgeX", extended:"Extended", paradex:"Paradex", grvt:"GRVT"};
const METRICS = {
  total_cost_bps: {label:"总成本", desc:"滑点 + taker 费，bps", sizeFree:false, lowerBetter:true},
  slippage_bps:   {label:"仅滑点", desc:"不含手续费，bps", sizeFree:false, lowerBetter:true},
  spread_bps:     {label:"买卖价差", desc:"bps，与单量无关", sizeFree:true, lowerBetter:true},
  book_depth_usd: {label:"盘口深度", desc:"单边挂单总额，与单量无关", sizeFree:true, lowerBetter:false},
};
const RANGES = {"24h":24, "7d":168, "30d":720, "all":Infinity};
const state = {
  tokens: new Set(["BTC","HYPE"]), clips: new Set([100000, 1000000]),
  metric: "total_cost_bps", side: "avg", range: "7d", scale: "lin", share: "own",
  venues: new Set(["hyperliquid","lighter","aster","edgex"]),
};
let ROWS = [], ALL_TOKENS = [], ALL_CLIPS = [], HOVER_T = null;
const PANELS = [];   // {el, svg, X, tip, data, render hover}

const css = n => getComputedStyle(document.querySelector(".viz-root")).getPropertyValue(n).trim();
const color = v => css(`--s${SLOT[v]}`);
const fmtClip = c => c >= 1e6 ? `$${c/1e6}M` : `$${c/1e3}k`;
const fmtVal = (v, m) => v == null || isNaN(v) ? "—" : m === "book_depth_usd"
  ? (v >= 1e6 ? `$${(v/1e6).toFixed(v >= 1e8 ? 0 : 1)}M` : `$${(v/1e3).toFixed(0)}k`)
  : Math.abs(v) >= 100 ? v.toFixed(0) : Math.abs(v) >= 10 ? v.toFixed(1) : v.toFixed(2);
const fmtTime = d => d.toLocaleString("zh-CN", {month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit", hour12:false});
const fmtAxisTime = (d, spanH) => spanH > 48
  ? d.toLocaleString("zh-CN", {month:"numeric", day:"numeric"})
  : d.toLocaleString("zh-CN", {hour:"2-digit", minute:"2-digit", hour12:false});

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/); const head = lines.shift().split(",");
  return lines.map(l => { const c = l.split(","); const o = {}; head.forEach((h,i) => o[h] = c[i]); return o; });
}

async function load() {
  let months;
  try { months = (await (await fetch("data/manifest.json", {cache:"no-store"})).json()).months; }
  catch { months = [new Date().toISOString().slice(0,7)]; }
  const texts = await Promise.all(months.map(m => fetch(`data/${m}/slippage.csv`, {cache:"no-store"}).then(r => r.ok ? r.text() : "")));
  ROWS = texts.filter(Boolean).flatMap(parseCSV).map(r => ({
    t: +new Date(r.run_ts), venue: r.venue, token: r.token, side: r.side, clip: +r.clip_usd,
    total_cost_bps: r.total_cost_bps === "" ? null : +r.total_cost_bps,
    slippage_bps: +r.slippage_bps, spread_bps: r.spread_bps === "" ? null : +r.spread_bps,
    book_depth_usd: +r.book_depth_usd, partial: r.partial === "True",
  }));
  const order = ["BTC","ETH","SOL","HYPE"];
  ALL_TOKENS = [...new Set(ROWS.map(r => r.token))].sort((a,b) => (order.indexOf(a)+99)%99 - (order.indexOf(b)+99)%99 || a.localeCompare(b));
  ALL_CLIPS = [...new Set(ROWS.map(r => r.clip))].sort((a,b) => a-b);
  for (const t of [...state.tokens]) if (!ALL_TOKENS.includes(t)) state.tokens.delete(t);
  for (const c of [...state.clips]) if (!ALL_CLIPS.includes(c)) state.clips.delete(c);
  if (!state.tokens.size && ALL_TOKENS.length) state.tokens.add(ALL_TOKENS[0]);
  if (!state.clips.size && ALL_CLIPS.length) state.clips.add(ALL_CLIPS[ALL_CLIPS.length-1]);
  renderStatus(); buildControls(); render();
}

function renderStatus() {
  const runs = new Set(ROWS.map(r => r.t));
  const latest = Math.max(...runs);
  const ageMin = (Date.now() - latest) / 60000;
  const fresh = ageMin < 90;
  document.getElementById("status").innerHTML = ROWS.length ? `
    <span class="pill"><span class="dot" style="background:${fresh ? "var(--s3)" : "var(--s4)"}"></span>最新 <b>${fmtTime(new Date(latest))}</b></span>
    <span class="pill">快照 <b>${runs.size}</b> 次</span>` : "";
}

// ----- controls -----
function chips(id, items, set, opts = {}) {
  const el = document.getElementById(id); el.innerHTML = "";
  for (const [val, html] of items) {
    const b = document.createElement("button"); b.type = "button"; b.className = "chip" + (opts.cls ? " " + opts.cls : "");
    b.innerHTML = html; b.setAttribute("aria-pressed", String(set.has(val)));
    b.onclick = () => {
      if (set.has(val)) { if (set.size > 1 || opts.allowEmpty) set.delete(val); } else set.add(val);
      buildControls(); render();
    };
    el.appendChild(b);
  }
}
function seg(id, items, key) {
  const el = document.getElementById(id); el.innerHTML = "";
  for (const [val, text] of items) {
    const b = document.createElement("button"); b.type = "button"; b.textContent = text;
    b.setAttribute("aria-pressed", String(state[key] === val));
    b.onclick = () => { state[key] = val; buildControls(); render(); };
    el.appendChild(b);
  }
}
function buildControls() {
  chips("tokens", ALL_TOKENS.map(t => [t, t]), state.tokens);
  chips("clips", ALL_CLIPS.map(c => [c, fmtClip(c)]), state.clips);
  document.getElementById("clipCtl").style.display = METRICS[state.metric].sizeFree ? "none" : "";
  seg("metric", Object.entries(METRICS).map(([k,v]) => [k, v.label]), "metric");
  seg("side", [["avg","买卖平均"],["buy","买"],["sell","卖"]], "side");
  seg("range", Object.keys(RANGES).map(k => [k, k === "all" ? "全部" : k]), "range");
  seg("scale", [["lin","线性"],["log","对数"]], "scale");
  seg("share", [["own","各图独立"],["token","同币种统一"]], "share");
  const present = VENUES.filter(v => ROWS.some(r => r.venue === v));
  chips("venues", present.map(v => [v, `<span class="sw" style="background:${color(v)}"></span>${LABEL[v]}`]), state.venues, {cls: "venue"});
}

// ----- data -----
function seriesFor(token, clip) {
  const m = state.metric, latest = Math.max(...ROWS.map(r => r.t));
  const cutoff = latest - RANGES[state.range] * 3600e3;
  const out = {};
  for (const v of VENUES) {
    if (!state.venues.has(v)) continue;
    const byT = new Map();
    for (const r of ROWS) {
      if (r.venue !== v || r.token !== token || r.t < cutoff) continue;
      if (clip != null && r.clip !== clip) continue;
      if (state.side !== "avg" && r.side !== state.side) continue;
      const e = byT.get(r.t) || {sum:0, n:0, partial:false};
      if (r[m] != null && !isNaN(r[m])) { e.sum += r[m]; e.n++; }
      e.partial ||= r.partial; byT.set(r.t, e);
    }
    const pts = [...byT].filter(([,e]) => e.n).map(([t,e]) => ({t, v: e.sum/e.n, partial: e.partial})).sort((a,b) => a.t-b.t);
    if (pts.length) out[v] = pts;
  }
  return out;
}

function niceTicks(lo, hi, n = 4) {
  if (hi <= lo) hi = lo + 1;
  const step0 = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(step0));
  const step = [1,2,2.5,5,10].map(s => s*mag).find(s => s >= step0);
  const ticks = []; let x = Math.floor(lo/step)*step;
  while (true) { ticks.push(+x.toFixed(10)); if (x >= hi - 1e-9) break; x += step; }
  return ticks;
}
function yScale(values, H, top, bottom) {
  const pos = values.filter(v => v > 0);
  const plotH = H - top - bottom;
  if (state.scale === "log" && pos.length) {
    const lo = Math.floor(Math.log10(Math.min(...pos))), hi = Math.max(Math.ceil(Math.log10(Math.max(...pos))), lo + 1);
    const ticks = []; for (let e = lo; e <= hi; e++) for (const k of [1, 2, 5]) { const v = k * 10 ** e; if (v <= 10 ** hi) ticks.push(v); }
    const L0 = Math.log10(ticks[0]), L1 = Math.log10(ticks[ticks.length-1]);
    const thin = ticks.length > 7 ? ticks.filter(v => /^1/.test(v.toPrecision(1))) : ticks;
    return {ticks: thin, Y: v => top + (1 - (Math.log10(Math.max(v, ticks[0])) - L0) / (L1 - L0)) * plotH};
  }
  const ticks = niceTicks(Math.min(0, ...values), Math.max(...values) * 1.06);
  const y0 = ticks[0], y1 = ticks[ticks.length-1];
  return {ticks, Y: v => top + (1 - (v - y0) / (y1 - y0)) * plotH};
}

// ----- render -----
function render() {
  const meta = METRICS[state.metric];
  const tokens = ALL_TOKENS.filter(t => state.tokens.has(t));
  const clips = meta.sizeFree ? [null] : ALL_CLIPS.filter(c => state.clips.has(c));
  const sideTxt = {avg:"买卖平均", buy:"买入", sell:"卖出"}[state.side];
  document.getElementById("hint").textContent =
    `${meta.label}（${meta.desc}，${sideTxt}）· ${tokens.length} 个币种 × ${clips.length} 个单量 · 鼠标悬停任一图可同步查看所有图的同一时点`;

  const root = document.getElementById("panels"); root.innerHTML = ""; PANELS.length = 0;
  if (!ROWS.length) { root.innerHTML = `<div class="empty">还没有数据</div>`; return; }

  for (const token of tokens) {
    const data = clips.map(c => ({clip: c, series: seriesFor(token, c)}));
    const shared = state.share === "token" ? Object.values(data).flatMap(d => Object.values(d.series).flat().map(p => p.v)) : null;
    const row = document.createElement("section"); row.className = "token-row";
    row.innerHTML = `<div class="token-head"><h2>${token}</h2><span>${meta.sizeFree ? "" : clips.map(fmtClip).join(" · ")}</span></div>`;
    const grid = document.createElement("div"); grid.className = "grid"; grid.style.setProperty("--cols", String(Math.min(clips.length, 4)));
    row.appendChild(grid); root.appendChild(row);
    const draws = data.map(d => { const [el, draw] = panel(token, d.clip, d.series, shared); grid.appendChild(el); return draw; });
    draws.forEach(f => f && f());
  }
  renderTable(tokens, clips);
}

function panel(token, clip, series, sharedValues) {
  const m = state.metric, meta = METRICS[m];
  const el = document.createElement("div"); el.className = "panel";
  const pts = Object.values(series).flat();
  const latestT = pts.length ? Math.max(...pts.map(p => p.t)) : null;
  const latestVals = Object.entries(series).map(([v, p]) => [v, p.find(q => q.t === latestT)]).filter(([,q]) => q);
  latestVals.sort((a,b) => meta.lowerBetter ? a[1].v - b[1].v : b[1].v - a[1].v);
  const best = latestVals[0];
  el.innerHTML = `<div class="p-head">
      <div class="p-title">${clip == null ? token : fmtClip(clip)}<small>${clip == null ? meta.label : token}</small></div>
      ${best ? `<div class="best">最新${meta.lowerBetter ? "最低" : "最深"}<br><b><span class="sw" style="background:${color(best[0])}"></span>${LABEL[best[0]]} ${fmtVal(best[1].v, m)}</b></div>` : ""}
    </div><div class="chart"></div>`;
  const chart = el.querySelector(".chart");
  if (!pts.length) { chart.innerHTML = `<div class="empty">当前筛选没有数据</div>`; return [el, null]; }
  return [el, () => drawChart(chart, token, clip, series, sharedValues, pts)];
}

function drawChart(chart, token, clip, series, sharedValues, pts) {
  const m = state.metric, meta = METRICS[m];
  const W = Math.max(260, Math.round(chart.clientWidth)), H = Math.round(Math.min(260, Math.max(170, W * 0.5)));
  const M = {l: 44, r: 10, t: 8, b: 24};
  const tMin = Math.min(...pts.map(p => p.t)), tMax = Math.max(...pts.map(p => p.t));
  const spanH = (tMax - tMin) / 3600e3;
  const {ticks, Y} = yScale(sharedValues || pts.map(p => p.v), H, M.t, M.b);
  const X = t => M.l + (tMax === tMin ? (W-M.l-M.r)/2 : (t - tMin) / (tMax - tMin) * (W - M.l - M.r));

  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${token} ${clip ? fmtClip(clip) : ""} ${meta.label}"><g class="axis">`;
  for (const v of ticks) s += `<line class="gridline" x1="${M.l}" x2="${W-M.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${M.l-6}" y="${Y(v)+3.5}" text-anchor="end">${fmtVal(v, m)}</text>`;
  const nx = Math.min(W < 380 ? 3 : 4, new Set(pts.map(p => p.t)).size);
  for (let i = 0; i < nx; i++) {
    const t = nx === 1 ? tMin : tMin + (tMax - tMin) * i / (nx - 1);
    s += `<text x="${X(t)}" y="${H-6}" text-anchor="${nx > 1 && i === 0 ? "start" : nx > 1 && i === nx-1 ? "end" : "middle"}">${fmtAxisTime(new Date(t), spanH)}</text>`;
  }
  s += `</g>`;
  const order = VENUES.filter(v => series[v]);
  for (const v of order) {
    const p = series[v];
    if (p.length > 1) s += `<path d="${p.map((q,i) => `${i?"L":"M"}${X(q.t).toFixed(1)},${Y(q.v).toFixed(1)}`).join("")}" fill="none" stroke="${color(v)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  const surf = css("--surface-1");
  for (const v of order) for (const q of series[v]) {
    const dense = series[v].length > 36;
    if (dense && !q.partial) continue;
    s += `<circle cx="${X(q.t)}" cy="${Y(q.v)}" r="${dense ? 3 : 3.5}" fill="${q.partial ? surf : color(v)}" stroke="${q.partial ? color(v) : surf}" stroke-width="${q.partial ? 1.6 : 1.5}"/>`;
  }
  s += `<line class="xh" y1="${M.t}" y2="${H-M.b}" stroke="${css("--text-muted")}" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>`;
  s += `<g class="hl"></g><rect class="hit" x="${M.l}" y="0" width="${W-M.l-M.r}" height="${H}" fill="transparent"/></svg><div class="tip"></div>`;
  chart.innerHTML = s;

  const svg = chart.querySelector("svg"), tip = chart.querySelector(".tip");
  const times = [...new Set(pts.map(p => p.t))].sort((a,b) => a-b);
  const P = {svg, tip, series, order, X, Y, W, times, m};
  PANELS.push(P);
  const hit = chart.querySelector(".hit");
  const onMove = ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    const t = times.reduce((a,b) => Math.abs(X(b)-px) < Math.abs(X(a)-px) ? b : a);
    syncHover(t, P);
  };
  hit.addEventListener("pointermove", onMove);
  hit.addEventListener("pointerdown", onMove);
  hit.addEventListener("pointerleave", () => syncHover(null, null));
}

function syncHover(t, active) {
  for (const P of PANELS) {
    const xh = P.svg.querySelector(".xh"), hl = P.svg.querySelector(".hl");
    if (t == null) { xh.setAttribute("visibility", "hidden"); hl.innerHTML = ""; P.tip.style.display = "none"; continue; }
    // snap to this panel's nearest timestamp (panels share run times)
    const tt = P.times.reduce((a,b) => Math.abs(b-t) < Math.abs(a-t) ? b : a);
    xh.setAttribute("x1", P.X(tt)); xh.setAttribute("x2", P.X(tt)); xh.setAttribute("visibility", "visible");
    const surf = css("--surface-1");
    const at = P.order.map(v => [v, P.series[v].find(q => q.t === tt)]).filter(([,q]) => q);
    hl.innerHTML = at.map(([v,q]) => `<circle cx="${P.X(tt)}" cy="${P.Y(q.v)}" r="4.5" fill="${color(v)}" stroke="${surf}" stroke-width="2"/>`).join("");
    if (P !== active) { P.tip.style.display = "none"; continue; }
    const desc = METRICS[P.m].lowerBetter;
    at.sort((a,b) => desc ? a[1].v - b[1].v : b[1].v - a[1].v);
    P.tip.innerHTML = `<div class="t">${fmtTime(new Date(tt))}</div>` + at.map(([v,q]) =>
      `<div class="r"><span><span class="sw" style="background:${color(v)}"></span>${LABEL[v]}</span><span class="v">${fmtVal(q.v, P.m)}${q.partial ? " *" : ""}</span></div>`).join("");
    P.tip.style.display = "block";
    const r = P.svg.getBoundingClientRect(), left = P.X(tt) * r.width / P.W, tw = P.tip.offsetWidth;
    P.tip.style.left = (left + 12 + tw > r.width ? Math.max(0, left - tw - 12) : left + 12) + "px";
    P.tip.style.top = "6px";
  }
}

function renderTable(tokens, clips) {
  const m = state.metric, meta = METRICS[m];
  const latest = Math.max(...ROWS.map(r => r.t));
  document.getElementById("tableSub").textContent = `${fmtTime(new Date(latest))} · ${meta.label} · 每列最优加粗`;
  const venues = VENUES.filter(v => state.venues.has(v) && ROWS.some(r => r.venue === v));
  const cols = tokens.flatMap(t => clips.map(c => [t, c]));
  const val = (v, t, c) => {
    const rs = ROWS.filter(r => r.t === latest && r.venue === v && r.token === t && (c == null || r.clip === c)
      && (state.side === "avg" || r.side === state.side) && r[m] != null && !isNaN(r[m]));
    return rs.length ? {v: rs.reduce((a,r) => a + r[m], 0) / rs.length, partial: rs.some(r => r.partial)} : null;
  };
  const grid = venues.map(v => cols.map(([t,c]) => val(v, t, c)));
  const bestIdx = cols.map((_, j) => {
    let bi = -1; grid.forEach((row, i) => { const x = row[j]; if (x && (bi < 0 || (meta.lowerBetter ? x.v < grid[bi][j].v : x.v > grid[bi][j].v))) bi = i; });
    return bi;
  });
  let h = `<table><thead><tr><th>交易所</th>${cols.map(([t,c]) => `<th>${t}${c == null ? "" : " " + fmtClip(c)}</th>`).join("")}</tr></thead><tbody>`;
  venues.forEach((v, i) => {
    h += `<tr><td><span class="sw" style="background:${color(v)};margin-right:6px"></span>${LABEL[v]}</td>` +
      cols.map((_, j) => { const x = grid[i][j]; return `<td class="${bestIdx[j] === i ? "min" : ""}">${x ? fmtVal(x.v, m) + (x.partial ? " *" : "") : "—"}</td>`; }).join("") + `</tr>`;
  });
  document.getElementById("tablewrap").innerHTML = h + "</tbody></table>";
}

let rz, lastW = innerWidth; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (innerWidth !== lastW) { lastW = innerWidth; render(); } }, 150); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { buildControls(); render(); });
load().catch(e => { document.getElementById("panels").innerHTML = `<div class="empty">加载失败：${e}</div>`; });
</script>
</body>
