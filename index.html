<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perp DEX Execution Cost Tracker</title>
<style>
/* ---------- tokens: light (default) ---------- */
.viz-root {
  color-scheme: light;
  --bg: #f5f5f7; --card: #ffffff; --card-2: #fbfbfd;
  --sep: rgba(0,0,0,.08); --grid: rgba(0,0,0,.06);
  --text: #1d1d1f; --text-2: #6e6e73; --text-3: #86868b;
  --link: #0066cc;
  --track: rgba(118,118,128,.12); --thumb: #ffffff; --thumb-shadow: 0 1px 3px rgba(0,0,0,.12), 0 1px 1px rgba(0,0,0,.04);
  --chip-on: #1d1d1f; --chip-on-text: #ffffff;
  --nav: rgba(251,251,253,.78);
  --shadow: 0 1px 2px rgba(0,0,0,.03), 0 8px 28px rgba(0,0,0,.05);
  --tip: rgba(255,255,255,.86);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6;
}
/* ---------- dark: explicit, or auto + OS dark ---------- */
.viz-root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #000000; --card: #1c1c1e; --card-2: #232325;
  --sep: rgba(255,255,255,.10); --grid: rgba(255,255,255,.07);
  --text: #f5f5f7; --text-2: #a1a1a6; --text-3: #8e8e93;
  --link: #2997ff;
  --track: rgba(118,118,128,.24); --thumb: #636366; --thumb-shadow: 0 1px 3px rgba(0,0,0,.4);
  --chip-on: #f5f5f7; --chip-on-text: #1d1d1f;
  --nav: rgba(22,22,23,.72);
  --shadow: none;
  --tip: rgba(44,44,46,.88);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9;
}
@media (prefers-color-scheme: dark) {
  .viz-root[data-theme="auto"] {
    color-scheme: dark;
    --bg: #000000; --card: #1c1c1e; --card-2: #232325;
    --sep: rgba(255,255,255,.10); --grid: rgba(255,255,255,.07);
    --text: #f5f5f7; --text-2: #a1a1a6; --text-3: #8e8e93;
    --link: #2997ff;
    --track: rgba(118,118,128,.24); --thumb: #636366; --thumb-shadow: 0 1px 3px rgba(0,0,0,.4);
    --chip-on: #f5f5f7; --chip-on-text: #1d1d1f;
    --nav: rgba(22,22,23,.72);
    --shadow: none;
    --tip: rgba(44,44,46,.88);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; }
.viz-root {
  background: var(--bg); color: var(--text); min-height: 100vh;
  font: 14px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  letter-spacing: -.01em; -webkit-font-smoothing: antialiased;
  transition: background-color .3s ease, color .3s ease;
}
button { font: inherit; letter-spacing: inherit; color: inherit; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ---------- nav ---------- */
.nav { position: sticky; top: 0; z-index: 20; background: var(--nav);
  backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--sep); }
.nav-in { max-width: 1440px; margin: 0 auto; height: 52px; padding: 0 28px; display: flex; align-items: center; gap: 16px; }
.brand { font-size: 17px; font-weight: 600; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.nav-in > .seg { flex: none; }
.nav-sp { flex: 1; }
.status { display: flex; align-items: center; gap: 14px; font-size: 12px; color: var(--text-2); white-space: nowrap; }
.status b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.live { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: 1px; }

/* ---------- segmented control (iOS) ---------- */
.seg { position: relative; display: inline-flex; padding: 2px; border-radius: 9px; background: var(--track); }
.seg button { position: relative; z-index: 1; border: 0; background: transparent; padding: 5px 12px; border-radius: 7px;
  font-size: 13px; font-weight: 500; color: var(--text); cursor: pointer; white-space: nowrap; transition: color .2s; }
.seg button[aria-pressed="true"] { font-weight: 600; }
.seg .thumb { position: absolute; z-index: 0; top: 2px; bottom: 2px; border-radius: 7px; background: var(--thumb);
  box-shadow: var(--thumb-shadow); transition: left .28s cubic-bezier(.3,.7,.2,1), width .28s cubic-bezier(.3,.7,.2,1); }
.seg.sm button { padding: 3px 9px; font-size: 12px; }
.seg.icon button { padding: 4px 8px; display: inline-flex; align-items: center; }
.seg.icon svg { width: 15px; height: 15px; display: block; }
.seg.disabled { opacity: .35; pointer-events: none; }

/* ---------- chips (multi-select) ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--track); color: var(--text);
  padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; cursor: pointer; line-height: 1.25;
  transition: background-color .2s, color .2s, opacity .2s, transform .12s; }
.chip:active { transform: scale(.96); }
.chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-text); }
.chip.venue[aria-pressed="true"] { background: var(--card); color: var(--text); box-shadow: inset 0 0 0 1.5px var(--text-3); }
.chip.venue[aria-pressed="false"] { color: var(--text-3); }
.chip.venue[aria-pressed="false"] .dot { background: var(--text-3) !important; }
.chips.disabled .chip { opacity: .35; pointer-events: none; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

/* ---------- layout ---------- */
.wrap { max-width: 1440px; margin: 0 auto; padding: 0 28px 64px; }
.hero { padding: 36px 0 22px; }
.hero h1 { font-size: 34px; line-height: 1.12; font-weight: 700; letter-spacing: -.03em; margin: 0 0 8px; }
.hero p { font-size: 15px; color: var(--text-2); margin: 0; max-width: 780px; }

.toolbar { margin: 0 0 22px; padding: 16px 20px; background: var(--card); border: 1px solid var(--sep);
  border-radius: 18px; box-shadow: var(--shadow); transition: background-color .3s; }
.tb-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 26px; }
.tb-row + .tb-row { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--grid); }
.ctl > label { display: block; font-size: 11px; font-weight: 500; color: var(--text-3); margin: 0 0 5px 2px; letter-spacing: 0; }
.ctl label .muted { font-weight: 400; }
.slot { min-width: 230px; }               /* fixed slot for metric-specific option: no reflow */
.slot .ph { font-size: 12px; color: var(--text-3); height: 30px; display: flex; align-items: center; padding-left: 2px; }

.summary { font-size: 13px; color: var(--text-2); margin: 0 0 18px; }
.token-row { margin-bottom: 30px; }
.token-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px 2px; }
.token-head h2 { font-size: 21px; font-weight: 700; letter-spacing: -.02em; margin: 0; }
.token-head span { font-size: 13px; color: var(--text-3); }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); }
@media (max-width: 1100px) { .grid { grid-template-columns: repeat(min(var(--cols), 2), minmax(0, 1fr)); } }

.panel { background: var(--card); border-radius: 18px; padding: 16px 16px 10px; box-shadow: var(--shadow);
  border: 1px solid var(--sep); min-width: 0; transition: background-color .3s; animation: rise .35s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.p-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
.p-title { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.p-title small { color: var(--text-3); font-weight: 500; margin-left: 6px; font-size: 12px; }
.best { text-align: right; font-size: 11px; color: var(--text-3); line-height: 1.35; }
.best b { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.chart { position: relative; }
svg.c { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.ax text { fill: var(--text-3); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.gl { stroke: var(--grid); stroke-width: 1; }
.tip { position: absolute; pointer-events: none; background: var(--tip); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--sep); border-radius: 12px; padding: 9px 11px; font-size: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.16);
  min-width: 168px; opacity: 0; transition: opacity .12s; z-index: 3; }
.tip.on { opacity: 1; }
.tip .t { color: var(--text-3); margin-bottom: 5px; font-weight: 500; }
.tip .r { display: flex; align-items: center; gap: 14px; justify-content: space-between; padding: 1.5px 0; }
.tip .r span:first-child { display: inline-flex; align-items: center; gap: 7px; color: var(--text-2); }
.tip .v { font-variant-numeric: tabular-nums; font-weight: 600; }
.empty { color: var(--text-3); font-size: 13px; padding: 56px 0; text-align: center; }

.card { background: var(--card); border-radius: 18px; border: 1px solid var(--sep); box-shadow: var(--shadow); padding: 16px 18px; margin-top: 6px; }
.card summary { cursor: pointer; font-weight: 600; font-size: 15px; list-style: none; display: flex; align-items: center; gap: 8px; }
.card summary::-webkit-details-marker { display: none; }
.card summary::before { content: "›"; display: inline-block; transition: transform .2s; color: var(--text-3); font-size: 18px; line-height: 1; }
.card[open] summary::before { transform: rotate(90deg); }
.card summary span { font-weight: 400; color: var(--text-3); font-size: 12px; }
.tablewrap { overflow: auto; max-height: 440px; margin-top: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 7px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--card); }
th { color: var(--text-3); font-weight: 500; position: sticky; top: 0; background: var(--card); z-index: 1; }
td.best-c { font-weight: 700; }
footer { margin-top: 28px; font-size: 12px; color: var(--text-3); line-height: 1.75; }
footer b { color: var(--text-2); font-weight: 600; }

@media (max-width: 900px) {
  .hero h1 { font-size: 28px; }
  .status .s-count { display: none; }
}
@media (max-width: 680px) {
  .grid { grid-template-columns: 1fr; }
  .wrap { padding: 0 16px 48px; } .nav-in { padding: 0 16px; gap: 10px; } .toolbar { padding: 14px; border-radius: 16px; }
  .brand { font-size: 15px; } .status, .nav-sp { display: none; } .nav-in .brand { flex: 1; } .slot { min-width: 0; }
  .seg.icon button { padding: 4px 6px; } .seg.sm button { padding: 3px 7px; }
}
</style>
</head>
<body>
<div class="viz-root" id="root" data-theme="auto">
  <nav class="nav"><div class="nav-in">
    <div class="brand" data-i18n="brand"></div>
    <div class="nav-sp"></div>
    <div class="status" id="status"></div>
    <div class="seg sm" id="lang"></div>
    <div class="seg icon" id="theme"></div>
  </div></nav>

  <div class="wrap">
    <section class="hero">
      <h1 data-i18n="title"></h1>
      <p data-i18n="subtitle"></p>
    </section>

    <div class="toolbar">
      <div class="tb-row">
        <div class="ctl"><label data-i18n="lblMetric"></label><div class="seg" id="metric"></div></div>
        <div class="ctl slot" id="slot"><label id="slotLabel"></label><div id="slotBody"></div></div>
        <div class="ctl"><label data-i18n="lblTokens"></label><div class="chips" id="tokens"></div></div>
        <div class="ctl"><label id="clipLabel"></label><div class="chips" id="clips"></div></div>
      </div>
      <div class="tb-row">
        <div class="ctl"><label data-i18n="lblSide"></label><div class="seg" id="side"></div></div>
        <div class="ctl"><label data-i18n="lblRange"></label><div class="seg" id="range"></div></div>
        <div class="ctl"><label data-i18n="lblScale"></label><div class="seg" id="scale"></div></div>
        <div class="ctl"><label data-i18n="lblShare"></label><div class="seg" id="share"></div></div>
        <div class="ctl"><label data-i18n="lblVenues"></label><div class="chips" id="venues"></div></div>
      </div>
    </div>

    <p class="summary" id="summary"></p>
    <div id="panels"><div class="empty" data-i18n="loading"></div></div>

    <details class="card" id="tablecard">
      <summary><span class="ttl" data-i18n="latestTable" style="font-weight:600;color:var(--text);font-size:15px"></span><span id="tableSub"></span></summary>
      <div class="tablewrap" id="tablewrap"></div>
    </details>

    <footer id="footer"></footer>
  </div>
</div>

<script>
/* ================= i18n ================= */
const I18N = {
  zh: {
    brand: "Perp DEX 成本追踪", title: "开仓成本，一目了然。",
    subtitle: "每小时对各家永续合约 DEX 的订单簿做一次快照，按市价单逐档吃单计算。总成本 = 相对 mid 的滑点 + taker 手续费。",
    lblMetric: "指标", lblTokens: "币种", lblClips: "单量", lblClipsNA: "单量 · 与该指标无关", lblSide: "方向", lblRange: "时间",
    lblScale: "纵轴", lblShare: "纵轴范围", lblVenues: "交易所", lblFee: "费率口径", lblBand: "深度范围", lblNone: "选项",
    noOption: "该指标无额外选项",
    m_total: "总成本", m_slip: "仅滑点", m_spread: "买卖价差", m_depth: "盘口深度",
    d_total: "滑点 + taker 费，bps", d_slip: "不含手续费，bps", d_spread: "bps", d_depth: "mid 附近挂单金额",
    s_avg: "买卖平均", s_buy: "买入", s_sell: "卖出", r_all: "全部",
    sc_lin: "线性", sc_log: "对数", sh_own: "各图独立", sh_token: "同币种统一",
    fee_base: "基础档", fee_vip: "最高档",
    lowest: r => `${r}中位数最低`, deepest: r => `${r}中位数最深`, rangeTxt: {"24h":"24 小时", "7d":"7 天", "30d":"30 天", "all":"全部时段"},
    latest: "最新", snaps: "快照", snapsUnit: "次",
    loading: "加载数据中…", noData: "还没有数据", noFilter: "当前筛选没有数据",
    depthSoon: "盘口深度（±bps 口径）从 2026-11-02 起开始记录，下一次快照后就会有数据",
    latestTable: "最新一次快照", bestBold: "每列最优加粗", venue: "交易所",
    summary: (m, extra, nt, nc) => `${m}${extra} · ${nt} 个币种${nc ? ` × ${nc} 个单量` : ""} · 悬停任一图可同步查看同一时点`,
    footer: `<b>总成本</b> = 滑点 + taker 费，费率取自 <a href="https://github.com/UT-Silver/perp-liquidity-tracker/blob/main/config/fees.json">config/fees.json</a>，对全部历史统一计算。
      <b>基础档</b>：Hyperliquid 4.5 · edgeX 4.5 · Aster 4.0 · Lighter 2.8 bps（Premium 账户；Standard 账户 0 费率但有 200–300ms 下单延迟，快照反映不出其成本）。
      <b>最高档</b>：各家公布的最低 taker（最高成交量档 + 最大代币折扣），属做市商量级，是费率下限：Hyperliquid 1.44 · Lighter 1.96 · Aster 1.6 · edgeX 2.4（Aster、edgeX 未经官方核实）。<br>
      <b>盘口深度</b> = mid 上下 ±10 bps / ±50 bps / ±1% 以内的挂单金额（买入看卖盘，卖出看买盘），各家同口径。
      <b>空心点</b>：滑点类指标表示盘口不够成交整笔单；深度指标表示抓到的盘口没覆盖到该范围。两种情况数值都偏乐观（滑点偏低 / 深度是下限）。<br>
      数据：<a href="https://github.com/UT-Silver/perp-liquidity-tracker/tree/main/data">github.com/UT-Silver/perp-liquidity-tracker</a>`,
    themeAuto: "跟随系统", themeLight: "浅色", themeDark: "深色",
  },
  en: {
    brand: "Perp DEX Cost Tracker", title: "Execution cost, at a glance.",
    subtitle: "Hourly order-book snapshots of perpetual DEXs, walked level by level as a market order. Total cost = slippage vs. mid + taker fee.",
    lblMetric: "Metric", lblTokens: "Tokens", lblClips: "Order size", lblClipsNA: "Order size · n/a for this metric", lblSide: "Side", lblRange: "Range",
    lblScale: "Y axis", lblShare: "Y scale", lblVenues: "Venues", lblFee: "Fee tier", lblBand: "Depth band", lblNone: "Option",
    noOption: "No options for this metric",
    m_total: "Total cost", m_slip: "Slippage", m_spread: "Spread", m_depth: "Depth",
    d_total: "slippage + taker fee, bps", d_slip: "excl. fees, bps", d_spread: "bps", d_depth: "resting notional near mid",
    s_avg: "Buy/sell avg", s_buy: "Buy", s_sell: "Sell", r_all: "All",
    sc_lin: "Linear", sc_log: "Log", sh_own: "Per chart", sh_token: "Per token",
    fee_base: "Base", fee_vip: "Top tier",
    lowest: r => `Lowest ${r} median`, deepest: r => `Deepest ${r} median`, rangeTxt: {"24h":"24h", "7d":"7d", "30d":"30d", "all":"all-time"},
    latest: "Latest", snaps: "Snapshots", snapsUnit: "",
    loading: "Loading data…", noData: "No data yet", noFilter: "No data for this selection",
    depthSoon: "Band depth is recorded from 2026-11-02; data appears after the next snapshot",
    latestTable: "Latest snapshot", bestBold: "best per column in bold", venue: "Venue",
    summary: (m, extra, nt, nc) => `${m}${extra} · ${nt} token${nt > 1 ? "s" : ""}${nc ? ` × ${nc} size${nc > 1 ? "s" : ""}` : ""} · hover any chart to sync all`,
    footer: `<b>Total cost</b> = slippage + taker fee, priced for all history from <a href="https://github.com/UT-Silver/perp-liquidity-tracker/blob/main/config/fees.json">config/fees.json</a>.
      <b>Base</b>: Hyperliquid 4.5 · edgeX 4.5 · Aster 4.0 · Lighter 2.8 bps (Premium account; Standard is 0% but adds a 200–300 ms taker delay a snapshot can't price).
      <b>Top tier</b>: best published taker (top volume tier + max token discount), market-maker scale, i.e. a floor: Hyperliquid 1.44 · Lighter 1.96 · Aster 1.6 · edgeX 2.4 (Aster, edgeX unverified).<br>
      <b>Depth</b> = resting notional within ±10 bps / ±50 bps / ±1% of mid (buy side = asks, sell side = bids), same definition on every venue.
      <b>Hollow points</b>: for cost metrics, the book was too thin to fill the whole order; for depth, the fetched book didn't reach the band. Both are optimistic (cost too low / depth a lower bound).<br>
      Data: <a href="https://github.com/UT-Silver/perp-liquidity-tracker/tree/main/data">github.com/UT-Silver/perp-liquidity-tracker</a>`,
    themeAuto: "System", themeLight: "Light", themeDark: "Dark",
  },
};
const store = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const t = k => I18N[state.lang][k];

/* ================= config ================= */
const VENUES = ["hyperliquid","lighter","aster","edgex","extended","paradex","grvt"];
const SLOT = {hyperliquid:1, lighter:2, aster:3, edgex:4, extended:5, paradex:6, grvt:7};   // color follows the entity
const LABEL = {hyperliquid:"Hyperliquid", lighter:"Lighter", aster:"Aster", edgex:"edgeX", extended:"Extended", paradex:"Paradex", grvt:"GRVT"};
const METRICS = {
  total_cost_bps: {k:"total", sizeFree:false, lowerBetter:true},
  slippage_bps:   {k:"slip",  sizeFree:false, lowerBetter:true},
  spread_bps:     {k:"spread",sizeFree:true,  lowerBetter:true},
  depth:          {k:"depth", sizeFree:true,  lowerBetter:false},
};
const RANGES = {"24h":24, "7d":168, "30d":720, "all":Infinity};
const BAND_TXT = {10:"±10 bps", 50:"±50 bps", 100:"±1%"};
const TOKEN_ORDER = ["BTC","ETH","SOL","HYPE","XRP","DOGE","SUI","ENA","ZEC","PUMP"];
const browserLang = (navigator.language || "zh").toLowerCase().startsWith("zh") ? "zh" : "en";
const state = {
  lang: store.get("pdt.lang", browserLang), theme: store.get("pdt.theme", "auto"),
  tokens: new Set(["BTC","ETH","SOL","HYPE"]), clips: new Set([10000, 100000, 500000, 1000000]),
  metric: "total_cost_bps", side: "avg", range: "7d", scale: "lin", share: "own", fee: "base", band: 50,
  venues: new Set(["hyperliquid","lighter","aster","edgex"]),
};
let ROWS = [], DROWS = [], ALL_TOKENS = [], ALL_CLIPS = [], FEES = {}, MANIFEST = null;
const LOADED = new Map(), DLOADED = new Map(), PANELS = [];

/* ================= helpers ================= */
const root = document.getElementById("root");
const css = n => getComputedStyle(root).getPropertyValue(n).trim();
const color = v => css(`--s${SLOT[v]}`);
const locale = () => state.lang === "zh" ? "zh-CN" : "en-US";

/* ================= data ================= */
async function load() {

  try {
    const v = (await (await fetch("config/fees.json", {cache:"no-store"})).json()).venues;
    FEES = Object.fromEntries(Object.entries(v).map(([k,x]) => [k, {base: +x.taker_bps, vip: +(x.vip_taker_bps ?? x.taker_bps)}]));
  } catch { FEES = {}; }
  const toks = new Set(Object.values(MANIFEST.tokens || {}).flat());
  ALL_TOKENS = [...toks].sort((a,b) => ((TOKEN_ORDER.indexOf(a)+1)||99) - ((TOKEN_ORDER.indexOf(b)+1)||99) || a.localeCompare(b));
  for (const x of [...state.tokens]) if (!toks.has(x)) state.tokens.delete(x);
  if (!state.tokens.size && ALL_TOKENS.length) state.tokens.add(ALL_TOKENS[0]);
  await ensureLoaded();
  for (const c of [...state.clips]) if (!ALL_CLIPS.includes(c)) state.clips.delete(c);
  if (!state.clips.size && ALL_CLIPS.length) state.clips.add(ALL_CLIPS[ALL_CLIPS.length-1]);

}
async function ensureLoaded() {

    const ms = months.filter(m => (MANIFEST.tokens[m] || []).includes(tok));
    const txt = await Promise.all(ms.map(m => fetch(`data/${m}/slippage/${tok}.csv`, {cache:"no-store"}).then(r => r.ok ? r.text() : "")));
    LOADED.set(tok, txt.filter(Boolean).flatMap(parseCSV).map(r => ({
      t: +new Date(r.run_ts), venue: r.venue, token: tok, side: r.side, clip: +r.clip_usd,
      slippage_bps: +r.slippage_bps, spread_bps: r.spread_bps === "" ? null : +r.spread_bps, partial: r.partial === "True",
    })));
  }));
  await Promise.all([...state.tokens].filter(x => !DLOADED.has(x)).map(async tok => {
    const ms = months.filter(m => ((MANIFEST.depth || {})[m] || []).includes(tok));
    const txt = await Promise.all(ms.map(m => fetch(`data/${m}/depth/${tok}.csv`, {cache:"no-store"}).then(r => r.ok ? r.text() : "")));
    DLOADED.set(tok, txt.filter(Boolean).flatMap(parseCSV).map(r => ({
      t: +new Date(r.run_ts), venue: r.venue, token: tok, side: r.side === "ask" ? "buy" : "sell",
      reach: +r.reach_bps, d: {10: +r.depth_10bps_usd, 50: +r.depth_50bps_usd, 100: +r.depth_100bps_usd},
    })));
  }));
  ROWS = [...LOADED.values()].flat(); DROWS = [...DLOADED.values()].flat();

}
const metricVal = (r, m) => m === "total_cost_bps" ? (FEES[r.venue] ? r.slippage_bps + FEES[r.venue][state.fee] : null)
  : m === "depth" ? r.d[state.band] : r[m];
const srcRows = () => state.metric === "depth" ? DROWS : ROWS;

function seriesFor(token, clip) {
  const m = state.metric, SRC = srcRows(); if (!SRC.length) return {};
  const latest = Math.max(...SRC.map(r => r.t)), cutoff = latest - RANGES[state.range] * 3600e3, out = {};
  for (const v of VENUES) {
    if (!state.venues.has(v)) continue;
    const byT = new Map();
    for (const r of SRC) {
      if (r.venue !== v || r.token !== token || r.t < cutoff) continue;
      if (clip != null && r.clip !== clip) continue;
      if (state.side !== "avg" && r.side !== state.side) continue;
      const e = byT.get(r.t) || {sum:0, n:0, partial:false}, x = metricVal(r, m);

function seg(id, items, key, opts = {}) {
  const el = document.getElementById(id); el.innerHTML = "";
  el.className = "seg" + (opts.cls ? " " + opts.cls : "") + (opts.disabled ? " disabled" : "");
  const thumb = document.createElement("span"); thumb.className = "thumb"; el.appendChild(thumb);
  let active = null;
  for (const [val, html, title] of items) {
    const b = document.createElement("button"); b.type = "button"; b.innerHTML = html; if (title) b.title = title;
    const on = state[key] === val; b.setAttribute("aria-pressed", String(on)); if (on) active = b;
    b.onclick = () => { if (state[key] === val) return; state[key] = val; opts.onChange ? opts.onChange(val) : refresh(); };
    el.appendChild(b);
  }
  // place thumb after layout; animate on subsequent moves
  const prev = SEG_POS[id];
  requestAnimationFrame(() => {
    if (!active) { thumb.style.width = "0"; return; }
    const to = {left: active.offsetLeft, width: active.offsetWidth};
    if (prev) { thumb.style.transition = "none"; thumb.style.left = prev.left + "px"; thumb.style.width = prev.width + "px"; void thumb.offsetWidth; thumb.style.transition = ""; }
    thumb.style.left = to.left + "px"; thumb.style.width = to.width + "px"; SEG_POS[id] = to;
  });
}
const SEG_POS = {};
function chips(id, items, set, opts = {}) {
  const el = document.getElementById(id); el.innerHTML = ""; el.className = "chips" + (opts.disabled ? " disabled" : "");
  for (const [val, html] of items) {
    const b = document.createElement("button"); b.type = "button"; b.className = "chip" + (opts.cls ? " " + opts.cls : "");
    b.innerHTML = html; b.setAttribute("aria-pressed", String(set.has(val)));
    b.onclick = async () => {
      if (set.has(val)) { if (set.size > 1) set.delete(val); else return; } else set.add(val);
      if (set === state.tokens) await ensureLoaded();
      refresh();

}

/* ================= render ================= */
function refresh() {

  document.title = t("brand");

function renderStatus() {
  if (!ROWS.length) { document.getElementById("status").innerHTML = ""; return; }
  const runs = new Set(ROWS.map(r => r.t)), latest = Math.max(...runs), fresh = (Date.now() - latest) / 60000 < 90;
  document.getElementById("status").innerHTML =
    `<span><span class="live" style="background:${fresh ? "var(--s3)" : "var(--s4)"}"></span>${t("latest")} <b>${fmtTime(new Date(latest))}</b></span>
     <span class="s-count">${t("snaps")} <b>${runs.size}</b>${t("snapsUnit") ? " " + t("snapsUnit") : ""}</span>`;
}
function niceTicks(lo, hi, n = 4) {

function render() {
  const meta = METRICS[state.metric];
  const tokens = ALL_TOKENS.filter(x => state.tokens.has(x));
  const clips = meta.sizeFree ? [null] : ALL_CLIPS.filter(c => state.clips.has(c));
  const extra = ` (${mDesc(state.metric)}, ${t("s_" + state.side)}` +
    (state.metric === "total_cost_bps" ? `, ${t("fee_" + state.fee)}` : state.metric === "depth" ? `, mid ${BAND_TXT[state.band]}` : "") + ")";
  document.getElementById("summary").textContent = t("summary")(mLabel(state.metric), state.lang === "zh" ? extra.replace(" (", "（").replace(/\)$/, "）").replaceAll(", ", "，") : extra, tokens.length, meta.sizeFree ? 0 : clips.length);

  const host = document.getElementById("panels"), keepY = window.scrollY;
  host.innerHTML = ""; PANELS.length = 0;
  if (!srcRows().length) { host.innerHTML = `<div class="empty">${state.metric === "depth" ? t("depthSoon") : t("noData")}</div>`; renderTable([], []); return; }
  for (const token of tokens) {

    const shared = state.share === "token" ? data.flatMap(d => Object.values(d.series).flat().map(p => p.v)) : null;
    const row = document.createElement("section"); row.className = "token-row";
    row.innerHTML = `<div class="token-head"><h2>${token}</h2><span>${meta.sizeFree ? mLabel(state.metric) : clips.map(fmtClip).join(" · ")}</span></div>`;
    const grid = document.createElement("div"); grid.className = "grid"; grid.style.setProperty("--cols", String(Math.min(clips.length, 4)));
    row.appendChild(grid); host.appendChild(row);

  }

function panel(token, clip, series, sharedValues) {
  const m = state.metric, meta = METRICS[m];
  const el = document.createElement("div"); el.className = "panel";
  const pts = Object.values(series).flat();
  // badge: venue with the best MEDIAN over the selected time range (robust to single-snapshot noise)
  const median = a => { const x = [...a].sort((p,q) => p-q), n = x.length; return n % 2 ? x[(n-1)/2] : (x[n/2-1] + x[n/2]) / 2; };
  const lv = Object.entries(series).map(([v, p]) => [v, {v: median(p.map(q => q.v)), partial: p.filter(q => q.partial).length * 2 > p.length, n: p.length}])
    .sort((a,b) => meta.lowerBetter ? a[1].v - b[1].v : b[1].v - a[1].v);
  const best = lv[0];
  const rtxt = t("rangeTxt")[state.range];
  el.innerHTML = `<div class="p-head">
      <div class="p-title">${clip == null ? token : fmtClip(clip)}<small>${clip == null ? mLabel(m) : token}</small></div>
      ${best ? `<div class="best" title="n = ${best[1].n}">${meta.lowerBetter ? t("lowest")(rtxt) : t("deepest")(rtxt)}<br><b><span class="dot" style="background:${color(best[0])}"></span>${LABEL[best[0]]} ${fmtVal(best[1].v, m)}${best[1].partial ? "*" : ""}</b></div>` : ""}
    </div><div class="chart"></div>`;

function drawChart(chart, token, clip, series, sharedValues, pts) {
  const m = state.metric;
  const W = Math.max(260, Math.round(chart.clientWidth)), H = Math.round(Math.min(260, Math.max(170, W * 0.5)));
  const M = {l: 46, r: 10, t: 10, b: 24};
  const tMin = Math.min(...pts.map(p => p.t)), tMax = Math.max(...pts.map(p => p.t)), spanH = (tMax - tMin) / 3600e3;
  const {ticks, Y} = yScale(sharedValues || pts.map(p => p.v), H, M.t, M.b);
  const X = tt => M.l + (tMax === tMin ? (W-M.l-M.r)/2 : (tt - tMin) / (tMax - tMin) * (W - M.l - M.r));
  let s = `<svg class="c" viewBox="0 0 ${W} ${H}" role="img" aria-label="${token} ${clip ? fmtClip(clip) : ""} ${mLabel(m)}"><g class="ax">`;
  for (const v of ticks) s += `<line class="gl" x1="${M.l}" x2="${W-M.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${M.l-8}" y="${Y(v)+3.5}" text-anchor="end">${fmtVal(v, m)}</text>`;
  const nx = Math.min(W < 380 ? 3 : 4, new Set(pts.map(p => p.t)).size);
  for (let i = 0; i < nx; i++) {
    const tt = nx === 1 ? tMin : tMin + (tMax - tMin) * i / (nx - 1);
    s += `<text x="${X(tt)}" y="${H-6}" text-anchor="${nx > 1 && i === 0 ? "start" : nx > 1 && i === nx-1 ? "end" : "middle"}">${fmtAxisTime(new Date(tt), spanH)}</text>`;
  }
  s += `</g>`;
  const order = VENUES.filter(v => series[v]), surf = css("--card");
  for (const v of order) {
    const p = series[v];
    if (p.length > 1) s += `<path d="${p.map((q,i) => `${i?"L":"M"}${X(q.t).toFixed(1)},${Y(q.v).toFixed(1)}`).join("")}" fill="none" stroke="${color(v)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  for (const v of order) for (const q of series[v]) {
    const dense = series[v].length > 36;
    if (dense && !q.partial) continue;
    s += `<circle cx="${X(q.t)}" cy="${Y(q.v)}" r="${dense ? 3 : 3.5}" fill="${q.partial ? surf : color(v)}" stroke="${q.partial ? color(v) : surf}" stroke-width="${q.partial ? 1.6 : 1.5}"/>`;
  }
  s += `<line class="xh" y1="${M.t}" y2="${H-M.b}" stroke="${css("--text-3")}" stroke-width="1" stroke-dasharray="2 3" visibility="hidden"/>`;
  s += `<g class="hl"></g><rect class="hit" x="${M.l}" y="0" width="${W-M.l-M.r}" height="${H}" fill="transparent"/></svg><div class="tip"></div>`;
  chart.innerHTML = s;
  const svg = chart.querySelector("svg"), tip = chart.querySelector(".tip");
  const times = [...new Set(pts.map(p => p.t))].sort((a,b) => a-b);
  const P = {svg, tip, series, order, X, Y, W, times, m}; PANELS.push(P);
  const hit = chart.querySelector(".hit");
  const onMove = ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    syncHover(times.reduce((a,b) => Math.abs(X(b)-px) < Math.abs(X(a)-px) ? b : a), P);
  };
  hit.addEventListener("pointermove", onMove); hit.addEventListener("pointerdown", onMove);
  hit.addEventListener("pointerleave", () => syncHover(null, null));
}

function syncHover(tt0, active) {
  const surf = css("--card");
  for (const P of PANELS) {
    const xh = P.svg.querySelector(".xh"), hl = P.svg.querySelector(".hl");
    if (tt0 == null) { xh.setAttribute("visibility", "hidden"); hl.innerHTML = ""; P.tip.classList.remove("on"); continue; }
    const tt = P.times.reduce((a,b) => Math.abs(b-tt0) < Math.abs(a-tt0) ? b : a);
    xh.setAttribute("x1", P.X(tt)); xh.setAttribute("x2", P.X(tt)); xh.setAttribute("visibility", "visible");
    const at = P.order.map(v => [v, P.series[v].find(q => q.t === tt)]).filter(([,q]) => q);
    hl.innerHTML = at.map(([v,q]) => `<circle cx="${P.X(tt)}" cy="${P.Y(q.v)}" r="4.5" fill="${color(v)}" stroke="${surf}" stroke-width="2"/>`).join("");
    if (P !== active) { P.tip.classList.remove("on"); continue; }
    const lb = METRICS[P.m].lowerBetter; at.sort((a,b) => lb ? a[1].v - b[1].v : b[1].v - a[1].v);
    P.tip.innerHTML = `<div class="t">${fmtTime(new Date(tt))}</div>` + at.map(([v,q]) =>
      `<div class="r"><span><span class="dot" style="background:${color(v)}"></span>${LABEL[v]}</span><span class="v">${fmtVal(q.v, P.m)}${q.partial ? " *" : ""}</span></div>`).join("");
    P.tip.classList.add("on");
    const r = P.svg.getBoundingClientRect(), left = P.X(tt) * r.width / P.W, tw = P.tip.offsetWidth;
    P.tip.style.left = (left + 14 + tw > r.width ? Math.max(0, left - tw - 14) : left + 14) + "px"; P.tip.style.top = "6px";

}

  const venues = VENUES.filter(v => state.venues.has(v) && SRC.some(r => r.venue === v));

  };

    if (x && (bi < 0 || (meta.lowerBetter ? x.v < grid[bi][j].v : x.v > grid[bi][j].v))) bi = i; }); return bi; });
  let h = `<table><thead><tr><th>${t("venue")}</th>${cols.map(([x,c]) => `<th>${x}${c == null ? "" : " " + fmtClip(c)}</th>`).join("")}</tr></thead><tbody>`;
  venues.forEach((v, i) => {
    h += `<tr><td><span class="dot" style="background:${color(v)};margin-right:8px"></span>${LABEL[v]}</td>` +
      cols.map((_, j) => { const x = grid[i][j]; return `<td class="${bestIdx[j] === i ? "best-c" : ""}">${x ? fmtVal(x.v, m) + (x.partial ? " *" : "") : "—"}</td>`; }).join("") + `</tr>`;
  });
  wrap.innerHTML = h + "</tbody></table>";
}

/* ================= boot ================= */
root.dataset.theme = state.theme;
document.documentElement.lang = state.lang;
let rz, lastW = innerWidth;
addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (innerWidth !== lastW) { lastW = innerWidth; for (const k in SEG_POS) delete SEG_POS[k]; buildControls(); render(); } }, 150); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (state.theme === "auto") refresh(); });
refresh();
load().catch(e => { document.getElementById("panels").innerHTML = `<div class="empty">Error: ${e}</div>`; });
</script>
</body>
</html>
