name: hourly-slippage-snapshot

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 UTC (off the top of the hour to avoid queue delays)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -q .

      - name: Take snapshot
        env:
          TRACK_TOKENS: BTC,ETH,SOL,HYPE
          TRACK_CLIPS: 10000,100000,500000,1000000
        run: python -m perp_liquidity.tracker

      - name: Commit data
        if: always()
        run: |
          git config user.name "snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -q -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 5
          done
          exit 1
