name: hourly-slippage-snapshot

on:
  schedule:
    # GitHub drops/delays scheduled runs, so fire every 15 min; the tracker
    # only snapshots when the last snapshot is >= 45 min old (~hourly series).
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Snapshot even if the last one is < 45 min old"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -q .

      - name: Take snapshot
        env:
          TRACK_TOKENS: BTC,ETH,SOL,HYPE,DOGE,XRP,PUMP,SUI,ENA,ZEC
          TRACK_CLIPS: 10000,100000,500000,1000000
          MIN_GAP_MINUTES: "45"
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: python -m perp_liquidity.tracker

      - name: Commit data
        if: always()
        run: |
          git config user.name "snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -q -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 5
          done
          exit 1
