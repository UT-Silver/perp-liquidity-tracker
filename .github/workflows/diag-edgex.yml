name: diag-edgex
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          H=https://edgex-prod-v2.edgex.exchange
          for p in "api/v1/public/meta/getMetaData" "api/v2/public/meta/getMetaData" \
                   "api/v1/public/quote/getDepth?contractId=10000001&level=200" "api/v2/public/quote/getDepth?contractId=10000001&level=200" \
                   "api/v1/public/quote/getTicker?contractId=10000001" "api/v2/public/quote/getTicker?contractId=10000001"; do
            code=$(curl -sS -m 15 -o r -w "%{http_code} %{content_type}" "$H/$p" 2>&1 || true)
            echo "== $p -> $code"; head -c 700 r 2>/dev/null | tr -d '\n'; echo
          done
          echo "== contract names"
          curl -sS -m 15 "$H/api/v1/public/meta/getMetaData" | python3 -c "import sys,json;d=json.load(sys.stdin)['data'];print([ (c.get('contractName'),c.get('contractId')) for c in d.get('contractList',[])][:15])" || true
