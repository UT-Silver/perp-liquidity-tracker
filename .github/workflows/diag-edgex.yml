name: diag-edgex
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for host in pro.edgex.exchange api.edgex.exchange edgex.exchange; do
            for p in "api/v2/public/meta/getMetaData" "api/v2/public/quote/getDepth?contractId=10000001&level=200" "api/v2/public/quote/getTicker?contractId=10000001" "api/v2/public/funding/getLatestFundingRate?contractId=10000001"; do
              u="https://$host/$p"
              code=$(curl -sS -m 15 -o body -w "%{http_code} %{content_type}" "$u" 2>&1 || true)
              echo "== $u -> $code"
              head -c 600 body | tr -d '\n'; echo
            done
          done
