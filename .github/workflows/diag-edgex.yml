name: diag-edgex
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -m 20 https://pro.edgex.exchange/ -o home.html
          grep -oE '(src|href)="[^"]+\.js"' home.html | sed -E 's/.*="([^"]+)"/\1/' | head -20 > js.txt
          cat js.txt
          : > hosts.txt
          while read -r s; do
            case "$s" in http*) u="$s";; //*) u="https:$s";; *) u="https://pro.edgex.exchange/${s#/}";; esac
            curl -sS -m 20 "$u" -o b.js || continue
            grep -oE 'https?://[a-zA-Z0-9.-]*edgex[a-zA-Z0-9.-]*' b.js >> hosts.txt || true
            grep -oE '"[a-zA-Z0-9./-]*/api/v[12]/public[a-zA-Z0-9/_-]*' b.js | head -5 >> hosts.txt || true
          done < js.txt
          echo "== hosts"; sort | uniq -c < hosts.txt | sort -rn | head -40
          echo "== try candidates"
          for h in $(grep -oE 'https?://[a-zA-Z0-9.-]*edgex[a-zA-Z0-9.-]*' hosts.txt | sort -u); do
            code=$(curl -sS -m 10 -o r -w "%{http_code} %{content_type}" "$h/api/v1/public/meta/getServerTime" 2>&1 || true)
            echo "$h v1 -> $code $(head -c 120 r | tr -d '\n')"
            code=$(curl -sS -m 10 -o r -w "%{http_code} %{content_type}" "$h/api/v2/public/meta/getServerTime" 2>&1 || true)
            echo "$h v2 -> $code $(head -c 120 r | tr -d '\n')"
          done
