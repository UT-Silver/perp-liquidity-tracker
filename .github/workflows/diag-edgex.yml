name: diag-edgex
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          H=https://edgex-prod-v2.edgex.exchange/api/v2/public
          curl -sS -m 15 "$H/meta/getMetaData" -o meta.json
          python3 - <<'PY'
          import json
          d=json.load(open("meta.json"))["data"]
          print("data keys:", list(d.keys()))
          for k,v in d.items():
              if isinstance(v,list) and v and isinstance(v[0],dict):
                  print("LIST", k, len(v), "keys:", list(v[0].keys())[:40])
          cl = d.get("contractList") or []
          for c in cl:
              n = str(c.get("contractName",""))
              if any(t in n for t in ("BTC","ETH","SOL","HYPE")):
                  print({k:c.get(k) for k in ("contractId","contractName","enableTrade","enableDisplay","defaultTakerFeeRate","defaultMakerFeeRate","fundingRateIntervalMin")})
          PY
          ID=$(python3 -c "import json;cl=json.load(open('meta.json'))['data'].get('contractList',[]);print(next((c['contractId'] for c in cl if str(c.get('contractName','')).upper().startswith('BTC')),''))")
          echo "BTC id=$ID"
          for p in "quote/getDepth?contractId=$ID&level=200" "quote/getTicker?contractId=$ID" "funding/getLatestFundingRate?contractId=$ID"; do
            echo "== $p"; curl -sS -m 15 "$H/$p" | head -c 900; echo
          done
