name: diag-tokens
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q .
      - run: |
          DATA_DIR=/tmp/probe TRACK_TOKENS=DOGE,XRP,PUMP,SUI,LINK,AVAX,ENA,WIF,FARTCOIN,BNB,LTC,ADA,TRUMP,ZEC,ASTER,WLD,TAO,NEAR,AAVE,UNI,KPEPE,1000PEPE,PEPE TRACK_CLIPS=100000 python -m perp_liquidity.tracker || true
          echo "== listed (venue,token) with data"; cut -d, -f2,3 /tmp/probe/*/slippage.csv | sort -u | tr '\n' ' '; echo
          echo "== not listed / errors"; cut -d, -f2,3,4 /tmp/probe/*/errors.csv | sort -u | tr '\n' ' '; echo
